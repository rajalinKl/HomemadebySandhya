backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "menu"
    label: "Menu Items"
    files:
      - file: "menu.json"
        label: "Current Site Menu"
        name: "menu_items"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            summary: "{{fields.Name}} - RM {{fields.Price}} ({{fields.Category}})"
            fields:
              - {label: "Item Name", name: "Name", widget: "string"}
              - {label: "Category", name: "Category", widget: "select", options: ["Weekly Menu", "Cakes & Sweet Confections", "Party Appetizers", "Street Snacks", "Signature Biryanis"]}
              - {label: "Price (RM)", name: "Price", widget: "number", value_type: "float"}
              - {label: "Description", name: "Description", widget: "text"}
              - {label: "Dish Image URL", name: "Image", widget: "string"}
              - {label: "Weekly Special Active?", name: "IsWeekly", widget: "string"}
