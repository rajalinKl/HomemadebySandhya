<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager | Homemade by Sandhya</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    
    <!-- Custom Brand Aesthetic Styling for Admin Panel -->
    <style>
      :root {
        --nc-bg: #fdfbfb;
        --nc-surface: #ffffff;
        --nc-primary: #2c1810;
        --nc-primary-hover: #4a2e23;
        --nc-accent: #d93838;
        --nc-border: #e2d4cc;
        --nc-text: #2c1810;
        --nc-text-light: #8c6d62;
      }
      body { background-color: var(--nc-bg) !important; color: var(--nc-text) !important; font-family: 'Inter', sans-serif !important; }
      /* Style primary action buttons to match site palette */
      button[class*="Button"], button[type="submit"] {
        background-color: var(--nc-primary) !important;
        border-radius: 10px !important;
        transition: background 0.2s ease;
      }
      button[class*="Button"]:hover {
        background-color: var(--nc-primary-hover) !important;
      }
      /* Clean up sidebars and panels */
      div[class*="SidebarContainer"] { background-color: #f4ece6 !important; border-right: 1px solid var(--nc-border) !important; }
      div[class*="CollectionMain"] { background-color: var(--nc-bg) !important; }
    </style>
</head>
<body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script src="preview.js"></script>

    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>
</body>
</html>
