<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homemade by Sandhya | Party & Catering Planner</title>
    <style>
        :root {
            --bg-pink-cream: #FAF2F5;
            --card-bg: #FFFFFF;
            --primary-pink: #D98895;
            --primary-hover: #C2727F;
            --teal-accent: #6BA8A3;
            --teal-light: #E6F2F1;
            --pastel-blush: #FDE8EC;
            --text-dark: #2C2628;
            --text-muted: #73686D;
            --border-radius: 20px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-pink-cream); color: var(--text-dark); overflow-x: hidden; line-height: 1.6; scroll-behavior: smooth; }
        h1, h2, h3, h4 { font-family: Georgia, serif; }

        nav { display: flex; justify-content: space-between; align-items: center; padding: 1rem 4%; background: rgba(250, 242, 245, 0.95); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid rgba(217, 136, 149, 0.2); box-shadow: 0 4px 20px rgba(0,0,0,0.02); }
        .logo-area { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .logo-img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary-pink); background-color: #fff; flex-shrink: 0; }
        .logo-text-group { display: flex; flex-direction: column; }
        .logo-title { font-size: 1.05rem; font-weight: 700; color: var(--text-dark); font-family: Georgia, serif; line-height: 1.1; }
        .logo-subtitle { font-size: 0.65rem; color: var(--teal-accent); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .nav-links { display: flex; gap: 1.2rem; list-style: none; align-items: center; }
        .nav-links a { text-decoration: none; color: var(--text-dark); font-weight: 500; font-size: 0.9rem; transition: color 0.2s ease; }
        .nav-links a:hover { color: var(--primary-pink); }
        .insta-badge { background: var(--pastel-blush); padding: 0.4rem 0.9rem; border-radius: 50px; font-size: 0.8rem; font-weight: 600; color: var(--primary-pink); text-decoration: none; border: 1px solid rgba(217,136,149,0.25); white-space: nowrap; }

        .hero { 
            position: relative;
            padding: 7rem 5% 6rem; 
            text-align: center; 
            background-image: linear-gradient(rgba(44, 38, 40, 0.65), rgba(107, 168, 163, 0.75)), url('https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=1920&q=85');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: white;
        }
        .hero h1 { font-size: 2.8rem; line-height: 1.2; margin-bottom: 1rem; font-weight: 700; text-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        .hero p { font-size: 1.1rem; color: #F7F1F3; max-width: 650px; margin: 0 auto 2.5rem; font-weight: 300; text-shadow: 0 2px 10px rgba(0,0,0,0.4); }
        .hero-btns { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
        
        .btn-primary { background: var(--primary-pink); color: white; padding: 12px 26px; border-radius: 40px; text-decoration: none; font-weight: 600; border: none; cursor: pointer; box-shadow: 0 6px 20px rgba(217,136,149,0.4); display: inline-block; text-align: center; transition: background 0.2s; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: rgba(255,255,255,0.2); backdrop-filter: blur(5px); color: white; border: 2px solid white; padding: 12px 26px; border-radius: 40px; text-decoration: none; font-weight: 600; cursor: pointer; display: inline-block; text-align: center; transition: background 0.2s; }
        .btn-secondary:hover { background: white; color: var(--text-dark); }

        .notice-banner { background: var(--teal-light); border: 1px solid rgba(107, 168, 163, 0.35); padding: 12px 18px; border-radius: 16px; text-align: center; max-width: 90%; margin: -20px auto 3rem; font-size: 0.85rem; font-weight: 600; color: #436E6A; position: relative; z-index: 10; box-shadow: 0 10px 30px rgba(0,0,0,0.03); }

        .container { max-width: 1300px; margin: 0 auto; padding: 1.5rem 4%; }
        .section-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2rem; border-bottom: 1px solid rgba(217,136,149,0.15); padding-bottom: 0.8rem; flex-wrap: wrap; gap: 10px; }
        .section-header h2 { font-size: 1.8rem; color: var(--text-dark); font-family: Georgia, serif; }
        .section-category-title { font-size: 1.4rem; color: var(--text-dark); margin: 2.5rem 0 1.2rem 0; padding-bottom: 0.4rem; border-bottom: 1px solid rgba(107,168,163,0.25); font-family: Georgia, serif; }

        .bento-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 20px; }
        .col-span-4 { grid-column: span 12; }
        .col-span-6 { grid-column: span 12; }
        .col-span-3 { grid-column: span 12; }

        .bento-card { background: var(--card-bg); border-radius: var(--border-radius); overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.04); display: flex; flex-direction: column; position: relative; border: 1px solid rgba(217,136,149,0.1); }
        .bento-img-placeholder { width: 100%; height: 160px; background: linear-gradient(135deg, #FDE8EC, #E6F2F1); display: flex; align-items: center; justify-content: center; font-size: 2.5rem; overflow: hidden; }
        .bento-img-placeholder img { width: 100%; height: 100%; object-fit: cover; }

        .bento-content { padding: 1.5rem; display: flex; flex-direction: column; justify-content: space-between; flex: 1; }
        .badge { display: inline-block; background: var(--teal-accent); color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.8rem; width: fit-content; }
        .badge.pink { background: var(--primary-pink); }

        .item-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.4rem; font-family: Georgia, serif; }
        .item-desc { font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 1.2rem; }
