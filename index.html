<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homemade by Sandhya | Party & Catering Planner</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-pink-cream: #FAF2F5;
            --card-bg: #FFFFFF;
            --primary-pink: #D98895;
            --primary-hover: #C2727F;
            --teal-accent: #6BA8A3;
            --teal-light: #E6F2F1;
            --pastel-blush: #FDE8EC;
            --text-dark: #2C2628;
            --text-muted: #73686D;
            --border-radius: 20px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-pink-cream); color: var(--text-dark); overflow-x: hidden; line-height: 1.6; scroll-behavior: smooth; }
        h1, h2, h3, h4 { font-family: 'Playfair Display', serif; }

        nav { display: flex; justify-content: space-between; align-items: center; padding: 1rem 4%; background: rgba(250, 242, 245, 0.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid rgba(217, 136, 149, 0.15); box-shadow: 0 4px 20px rgba(0,0,0,0.02); }
        .logo-area { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .logo-img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary-pink); background-color: #fff; flex-shrink: 0; box-shadow: 0 3px 10px rgba(217,136,149,0.25); }
        .logo-text-group { display: flex; flex-direction: column; }
        .logo-title { font-size: 1.05rem; font-weight: 700; color: var(--text-dark); font-family: 'Playfair Display', serif; line-height: 1.1; }
        .logo-subtitle { font-size: 0.65rem; color: var(--teal-accent); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .nav-links { display: flex; gap: 1.2rem; list-style: none; align-items: center; }
        .nav-links a { text-decoration: none; color: var(--text-dark); font-weight: 500; font-size: 0.9rem; transition: color 0.2s ease; }
        .nav-links a:hover { color: var(--primary-pink); }
        .insta-badge { background: var(--pastel-blush); padding: 0.4rem 0.9rem; border-radius: 50px; font-size: 0.8rem; font-weight: 600; color: var(--primary-pink); text-decoration: none; border: 1px solid rgba(217,136,149,0.25); white-space: nowrap; }

        .hero { 
            position: relative;
            padding: 5rem 5% 4.5rem; 
            text-align: center; 
            background: linear-gradient(rgba(44, 38, 40, 0.6), rgba(107, 168, 163, 0.45)), url('https://images.unsplash.com/photo-1543353071-873f17a7a088?auto=format&fit=crop&w=1920&q=85') no-repeat center center/cover;
            color: white;
        }
        .hero h1 { font-size: 2.5rem; line-height: 1.2; margin-bottom: 1.0rem; font-weight: 700; text-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .hero p { font-size: 1.05rem; color: #F7F1F3; max-width: 600px; margin: 0 auto 2rem; font-weight: 300; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
        .hero-btns { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
        
        .btn-primary { background: var(--primary-pink); color: white; padding: 12px 26px; border-radius: 40px; text-decoration: none; font-weight: 600; border: none; cursor: pointer; box-shadow: 0 6px 20px rgba(217,136,149,0.35); display: inline-block; text-align: center; transition: background 0.2s; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: rgba(255,255,255,0.15); backdrop-filter: blur(8px); color: white; border: 2px solid rgba(255,255,255,0.7); padding: 12px 26px; border-radius: 40px; text-decoration: none; font-weight: 600; cursor: pointer; display: inline-block; text-align: center; transition: background 0.2s; }
        .btn-secondary:hover { background: white; color: var(--text-dark); }

        .notice-banner { background: var(--teal-light); border: 1px solid rgba(107, 168, 163, 0.35); padding: 12px 18px; border-radius: 16px; text-align: center; max-width: 90%; margin: -20px auto 3rem; font-size: 0.85rem; font-weight: 600; color: #436E6A; position: relative; z-index: 10; box-shadow: 0 10px 30px rgba(0,0,0,0.03); }

        .container { max-width: 1300px; margin: 0 auto; padding: 1.5rem 4%; }
        .section-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2rem; border-bottom: 1px solid rgba(217,136,149,0.15); padding-bottom: 0.8rem; flex-wrap: wrap; gap: 10px; }
        .section-header h2 { font-size: 1.8rem; color: var(--text-dark); }
        .section-category-title { font-size: 1.4rem; color: var(--text-dark); margin: 2.5rem 0 1.2rem 0; padding-bottom: 0.4rem; border-bottom: 1px solid rgba(107,168,163,0.25); font-family: 'Playfair Display', serif; }

        .bento-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 20px; }
        .col-span-12 { grid-column: span 12; }
        .col-span-8 { grid-column: span 12; }
        .col-span-4 { grid-column: span 12; }
        .col-span-6 { grid-column: span 12; }
        .col-span-3 { grid-column: span 12; }

        .bento-card { background: var(--card-bg); border-radius: var(--border-radius); overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.04); display: flex; flex-direction: column; position: relative; border: 1px solid rgba(217,136,149,0.1); }
        .bento-img-wrap { position: relative; width: 100%; height: 200px; overflow: hidden; }
        .bento-card.tall .bento-img-wrap { height: 240px; }
        .bento-img-wrap img { width: 100%; height: 100%; object-fit: cover; }

        .bento-content { padding: 1.5rem; display: flex; flex-direction: column; justify-content: space-between; flex: 1; }
        .badge { display: inline-block; background: var(--teal-accent); color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.8rem; width: fit-content; }
        .badge.pink { background: var(--primary-pink); }

        .item-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.4rem; }
        .item-desc { font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 1.2rem; }

        .card-footer-flex { display: flex; justify-content: space-between; align-items: center; margin-top: auto; width: 100%; gap: 10px; }
        .price-tag { font-size: 1.2rem; font-weight: 700; color: var(--primary-pink); white-space: nowrap; }
        
        .order-btn { background: var(--teal-light); color: #355A57; border: none; padding: 9px 16px; border-radius: 12px; font-weight: 600; font-size: 0.8rem; cursor: pointer; white-space: nowrap; transition: background 0.2s; }
        .order-btn:hover { background: #D0EBE8; }

        .bespoke-wrapper { background: linear-gradient(135deg, #FDE8EC 0%, #E6F2F1 100%); border-radius: 24px; padding: 2rem 1.5rem; margin: 4rem 0; border: 1px solid rgba(107,168,163,0.3); }
        .bespoke-grid { display: grid; grid-template-columns: 1fr; gap: 2.5rem; align-items: center; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; color: var(--text-dark); }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid #D1C5C8; font-family: inherit; background: white; font-size: 0.95rem; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(44,38,40,0.65); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 2000; padding: 1rem; }
        .modal-content { background: white; width: 100%; max-width: 480px; padding: 2rem 1.5rem; border-radius: 24px; box-shadow: 0 30px 60px rgba(0,0,0,0.2); position: relative; max-height: 90vh; overflow-y: auto; }
        .close-modal { position: absolute; top: 18px; right: 18px; background: #FAF2F5; border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-weight: bold; font-size: 0.9rem; color: var(--text-dark); }

        footer { background: var(--text-dark); color: white; text-align: center; padding: 3rem 5%; margin-top: 5rem; }
        footer a { color: #F5C6CE; text-decoration: none; }

        @media(min-width: 768px) {
            .hero h1 { font-size: 3.5rem; }
            .hero { padding: 6rem 6% 5rem; }
            .col-span-8 { grid-column: span 8; }
            .col-span-4 { grid-column: span 4; }
            .col-span-6 { grid-column: span 6; }
            .col-span-3 { grid-column: span 3; }
            .bespoke-wrapper { padding: 4rem; }
            .bespoke-grid { grid-template-columns: 1.1fr 0.9fr; gap: 4rem; }
            .modal-content { padding: 2.5rem; }
            .section-header h2 { font-size: 2.3rem; }
        }
        
        @media(max-width: 767px) {
            .nav-links { display: none; }
        }
    </style>
</head>

            <img src="logo.jpg" alt="Logo" class="logo-img" onerror="this.src='
