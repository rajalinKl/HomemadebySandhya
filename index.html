<script>
    const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbym1DK8prXDaukpxOjGsfp1Atd1oDYS_WHynSmTM0qNirXt6ThR6exjMx4XsaV-smFoyQ/exec";
    // Wrap with a CORS proxy to bypass browser security blocks instantly
    const PROXIED_API_URL = `https://api.allorigins.win/get?url=${encodeURIComponent(SHEET_API_URL)}`;

    let currentItem = "";
    let currentPrice = 0;

    async function fetchMenuData() {
        try {
            const response = await fetch(PROXIED_API_URL);
            const wrapper = await response.json();
            const items = JSON.parse(wrapper.contents);
            
            if (items && items.length > 0) {
                renderMenu(items);
            } else {
                document.getElementById('weeklyContainer').innerHTML = '<p style="grid-column: span 12; text-align: center; color: var(--text-muted);">No items found in sheet.</p>';
            }
        } catch (err) {
            console.error("Error fetching menu data:", err);
            document.getElementById('weeklyContainer').innerHTML = '<p style="grid-column: span 12; text-align: center; color: var(--primary-pink);">Unable to connect to menu source.</p>';
        }
    }

    function renderMenu(items) {
        const weeklyContainer = document.getElementById('weeklyContainer');
        const fullMenuContainer = document.getElementById('fullMenuContainer');
        
        weeklyContainer.innerHTML = "";
        fullMenuContainer.innerHTML = "";

        let weeklyHTML = "";
        let categories = {};

        items.forEach(item => {
            if (String(item.IsWeekly).toUpperCase() === "TRUE") {
                weeklyHTML += `
                    <div class="bento-card col-span-4">
                        <div class="bento-img-placeholder">${item.Image && item.Image.startsWith('http') ? `<img src="${item.Image}" alt="${item.Name}">` : (item.Image || '🍱')}</div>
                        <div class="bento-content">
                            <div>
                                <span class="badge pink">Weekly Special</span>
                                <h3 class="item-title">${item.Name}</h3>
                                <p class="item-desc">${item.Description}</p>
                            </div>
                            <div class="card-footer-flex">
                                <div class="price-tag">RM ${parseFloat(item.Price).toFixed(2)}</div>
                                <button class="order-btn" onclick="openCheckout('${item.Name.replace(/'/g, "\\'")}', ${item.Price})">Pre-Order</button>
                            </div>
                        </div>
                    </div>`;
            }

            let cat = item.Category || "Party Menu";
            if (!categories[cat]) categories[cat] = [];
            categories[cat].push(item);
        });

        weeklyContainer.innerHTML = weeklyHTML || '<p style="grid-column: span 12; text-align: center; color: var(--text-muted);">No items marked as weekly active.</p>';

        let fullHTML = "";
        for (let cat in categories) {
            fullHTML += `<h3 class="section-category-title">${cat}</h3><div class="bento-grid">`;
            categories[cat].forEach(item => {
                fullHTML += `
                    <div class="bento-card col-span-4">
                        <div class="bento-img-placeholder">${item.Image && item.Image.startsWith('http') ? `<img src="${item.Image}" alt="${item.Name}">` : (item.Image || '🍽️')}</div>
                        <div class="bento-content">
                            <div>
                                <h3 class="item-title" style="font-size: 1.1rem;">${item.Name}</h3>
                                <p class="item-desc" style="font-size: 0.8rem;">${item.Description}</p>
                            </div>
                            <div class="card-footer-flex">
                                <div class="price-tag" style="font-size: 1rem;">RM ${parseFloat(item.Price).toFixed(2)}</div>
                                <button class="order-btn" onclick="openCheckout('${item.Name.replace(/'/g, "\\'")}', ${item.Price})">Select</button>
                            </div>
                        </div>
                    </div>`;
            });
            fullHTML += `</div>`;
        }
        fullMenuContainer.innerHTML = fullHTML;
    }

    function openCheckout(name, price) {
        currentItem = name;
        currentPrice = price;
        document.getElementById('modalSummary').innerHTML = `<strong>Selected Item:</strong> ${name}<br><strong>Price:</strong> RM ${parseFloat(price).toFixed(2)}<br><small style="color:var(--primary-pink); font-weight:600;">⚠️ Reminder: Weekly orders require 2 days advance notice.</small>`;
        document.getElementById('checkoutModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('checkoutModal').style.display = 'none';
    }

    function toggleAddressField() {
        const method = document.getElementById('fulfillment').value;
        const addressGroup = document.getElementById('addressGroup');
        addressGroup.style.display = method === 'delivery' ? 'block' : 'none';
    }

    function processPayment() {
        const method = document.getElementById('fulfillment').value;
        const address = document.getElementById('deliveryAddress').value;
        if (method === 'delivery' && !address.trim()) {
            alert('Please enter your delivery address.');
            return;
        }
        alert(`Redirecting securely to payment gateway...\n\nItem: ${currentItem}\nFulfillment: ${method.toUpperCase()}\nBase Total: RM ${parseFloat(currentPrice).toFixed(2)}${method === 'delivery' ? '\n(Note: Grab delivery charges calculated & billed separately).' : ''}`);
        closeModal();
    }

    window.onload = function() {
        fetchMenuData();
    };

    window.onclick = function(event) {
        const modal = document.getElementById('checkoutModal');
        if (event.target === modal) closeModal();
    }
</script>
